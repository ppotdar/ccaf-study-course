<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" role="img" aria-label="Narrow cross-role tool: verify_fact fast path versus the coordinator round trip" data-name="verify"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="428" fill="#FFFFFF"/><defs><marker id="m-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">Simple checks take a shortcut; complex ones go through the coordinator</text><rect x="280" y="52" width="200" height="56" rx="8" class="svg-box accent"/><text x="380" y="76" class="svg-label strong">Coordinator</text><text x="380" y="95" class="svg-note svg-mid">splits work · routes research</text><rect x="40" y="196" width="220" height="56" rx="8" class="svg-box "/><text x="150" y="220" class="svg-label strong">Synthesis subagent</text><text x="150" y="239" class="svg-note svg-mid">writing tools + verify_fact</text><rect x="500" y="196" width="220" height="56" rx="8" class="svg-box "/><text x="610" y="220" class="svg-label strong">Search subagent</text><text x="610" y="239" class="svg-note svg-mid">web search · load_document</text><path d="M150 196V80H280" class="svg-edge" fill="none" marker-end="url(#m-verify)"/><path d="M480 80H610V196" class="svg-edge" fill="none" marker-end="url(#m-verify)"/><text x="162" y="122" class="svg-note svg-left">complex check</text><text x="162" y="138" class="svg-note svg-left">(new subtopic, more sources)</text><text x="498" y="122" class="svg-note svg-left">routed to search</text><text x="380" y="166" class="svg-label strong">4 hops round trip</text><text x="380" y="184" class="svg-note svg-mid">fine when rare, slow when frequent</text><path d="M150 252V302" class="svg-edge" fill="none" marker-end="url(#m-verify)"/><text x="162" y="282" class="svg-note svg-left">frequent, simple check · 1 call</text><rect x="40" y="302" width="220" height="44" rx="8" class="svg-box good"/><text x="150" y="329" class="svg-mono svg-mid">verify_fact(claim, source_url)</text><text x="150" y="368" class="svg-note svg-mid">returns confirmed / contradicted / not found</text><text x="610" y="282" class="svg-label strong">Traps</text><rect x="500" y="292" width="220" height="40" rx="8" class="svg-box bad"/><text x="610" y="317" class="svg-label">✗ Full web search on synthesis</text><rect x="500" y="342" width="220" height="40" rx="8" class="svg-box bad"/><text x="610" y="367" class="svg-label">✗ One mega-agent, ~18 tools</text><text x="24" y="410" class="svg-note svg-left">Frequent + simple → a narrow tool on the agent that needs it.  Rare or complex → the coordinator.</text></svg>