<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Decision tree: where an instruction should live in Claude Code" data-name="tree"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="520" fill="#FFFFFF"/><defs><marker id="m-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">Where should this instruction live?</text><rect x="24" y="48" width="330" height="40" rx="8" class="svg-box accent"/><text x="189" y="73" class="svg-label strong">I have an instruction for Claude Code</text><path d="M189 88V112" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><rect x="24" y="112" width="330" height="44" rx="8" class="svg-box "/><text x="189" y="139" class="svg-label">Must it never be broken?</text><path d="M354 134H420" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="387" y="127" class="svg-note svg-mid">yes</text><rect x="420" y="112" width="316" height="44" rx="8" class="svg-box good"/><text x="436" y="131" class="svg-label strong svg-left">Permission deny rule or hook</text><text x="436" y="148" class="svg-note svg-left">In settings.json · enforced by code, not the model</text><path d="M189 156V180" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="199" y="172" class="svg-note svg-left">no</text><rect x="24" y="180" width="330" height="44" rx="8" class="svg-box "/><text x="189" y="207" class="svg-label">Does it apply to every task, all the time?</text><path d="M354 202H420" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="387" y="195" class="svg-note svg-mid">yes</text><rect x="420" y="180" width="316" height="44" rx="8" class="svg-box good"/><text x="436" y="199" class="svg-label strong svg-left">CLAUDE.md</text><text x="436" y="216" class="svg-note svg-left">Always loaded, every session</text><path d="M189 224V248" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="199" y="240" class="svg-note svg-left">no</text><rect x="24" y="248" width="330" height="44" rx="8" class="svg-box "/><text x="189" y="275" class="svg-label">Only for certain file types or folders?</text><path d="M354 270H420" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="387" y="263" class="svg-note svg-mid">yes</text><rect x="420" y="248" width="316" height="44" rx="8" class="svg-box good"/><text x="436" y="267" class="svg-label strong svg-left">.claude/rules/*.md + paths:</text><text x="436" y="284" class="svg-note svg-left">Loads only when matching files are touched</text><path d="M189 292V316" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="199" y="308" class="svg-note svg-left">no</text><rect x="24" y="316" width="330" height="44" rx="8" class="svg-box "/><text x="189" y="343" class="svg-label">A separate job with its own context?</text><path d="M354 338H420" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="387" y="331" class="svg-note svg-mid">yes</text><rect x="420" y="316" width="316" height="44" rx="8" class="svg-box good"/><text x="436" y="335" class="svg-label strong svg-left">Subagent in .claude/agents/</text><text x="436" y="352" class="svg-note svg-left">Own context window, tools and prompt</text><path d="M189 360V384" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="199" y="376" class="svg-note svg-left">no</text><rect x="24" y="384" width="330" height="44" rx="8" class="svg-box "/><text x="189" y="411" class="svg-label">Should only a person trigger it, by name?</text><path d="M354 406H420" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="387" y="399" class="svg-note svg-mid">yes</text><rect x="420" y="384" width="316" height="44" rx="8" class="svg-box good"/><text x="436" y="403" class="svg-label strong svg-left">Slash command</text><text x="436" y="420" class="svg-note svg-left">Or a skill with disable-model-invocation: true</text><path d="M189 428V452" class="svg-edge" fill="none" marker-end="url(#m-tree)"/><text x="199" y="444" class="svg-note svg-left">no</text><rect x="24" y="452" width="330" height="44" rx="8" class="svg-box good"/><text x="40" y="471" class="svg-label strong svg-left">Skill in .claude/skills/</text><text x="40" y="488" class="svg-note svg-left">Loads on demand when its description matches</text></svg>