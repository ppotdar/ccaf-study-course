<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308" role="img" aria-label="Multi-agent research system with coordinator and three subagents" data-name="s3"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="308" fill="#FFFFFF"/><g transform="translate(0,-34)"><defs><marker id="m-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><rect x="24" y="56" width="150" height="40" rx="8" class="svg-box "/><text x="99.0" y="81" class="svg-label strong">Research question</text><path d="M174 76H230" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="230" y="50" width="300" height="41" rx="8" class="svg-box accent"/><text x="380.0" y="69" class="svg-label strong">Coordinator</text><text x="380.0" y="86" class="svg-note svg-mid">splits the topic broadly, covers every subtopic</text><path d="M530 76H576" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="576" y="50" width="160" height="41" rx="8" class="svg-box good"/><text x="656.0" y="69" class="svg-label strong">Cited report</text><text x="656.0" y="86" class="svg-note svg-mid">conflicts shown, dated</text><path d="M380 106V140M134 140H626" class="svg-edge" fill="none"/><path d="M134 140V166" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="24" y="166" width="220" height="41" rx="8" class="svg-box "/><text x="134.0" y="185" class="svg-label strong">Search</text><text x="134.0" y="202" class="svg-note svg-mid">finds sources</text><path d="M380 140V166" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="270" y="166" width="220" height="41" rx="8" class="svg-box "/><text x="380.0" y="185" class="svg-label strong">Document analysis</text><text x="380.0" y="202" class="svg-note svg-mid">reads and extracts</text><path d="M626 140V166" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="516" y="166" width="220" height="41" rx="8" class="svg-box "/><text x="626.0" y="185" class="svg-label strong">Synthesis</text><text x="626.0" y="202" class="svg-note svg-mid">writes the report</text><path d="M134 246V207" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="24" y="246" width="220" height="56" rx="8" class="svg-box good"/><text x="134.0" y="265" class="svg-label strong">Errors with context</text><text x="134.0" y="282" class="svg-note svg-mid">timeout + what was tried,</text><text x="134.0" y="297" class="svg-note svg-mid">sent up to the coordinator</text><path d="M380 246V207" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="270" y="246" width="220" height="56" rx="8" class="svg-box good"/><text x="380.0" y="265" class="svg-label strong">Structured findings</text><text x="380.0" y="282" class="svg-note svg-mid">claim · source URL · page · date,</text><text x="380.0" y="297" class="svg-note svg-mid">passed in the prompt</text><path d="M626 246V207" class="svg-edge" fill="none" marker-end="url(#m-s3)"/><rect x="516" y="246" width="220" height="56" rx="8" class="svg-box good"/><text x="626.0" y="265" class="svg-label strong">Narrow verify_fact tool</text><text x="626.0" y="282" class="svg-note svg-mid">fast path for simple checks;</text><text x="626.0" y="297" class="svg-note svg-mid">big ones via coordinator</text><text x="24" y="330" class="svg-note svg-left">Subagents start blank: everything they need goes in their prompt. A gap in the report usually means the split was too narrow.</text></g></svg>