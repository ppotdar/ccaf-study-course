<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="Customer support agent with gates, hooks and structured handoff" data-name="s1"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="372" fill="#FFFFFF"/><defs><marker id="m-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">1 · Customer Support Resolution Agent</text><rect x="24" y="56" width="140" height="40" rx="8" class="svg-box "/><text x="94.0" y="81" class="svg-label strong">Customer</text><path d="M164 76H220" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="220" y="50" width="240" height="41" rx="8" class="svg-box accent"/><text x="340.0" y="69" class="svg-label strong">Support agent</text><text x="340.0" y="86" class="svg-note svg-mid">Agent SDK · loops on stop_reason</text><path d="M460 76H500" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="500" y="50" width="236" height="41" rx="8" class="svg-box good"/><text x="618.0" y="69" class="svg-label strong">Case-facts block</text><text x="618.0" y="86" class="svg-note svg-mid">IDs, amounts, dates re-sent each turn</text><path d="M340 106V146M106 146H637" class="svg-edge" fill="none"/><path d="M106 146V176" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="24" y="176" width="165" height="40" rx="8" class="svg-box "/><text x="106.5" y="201" class="svg-mono svg-mid">get_customer</text><path d="M283 146V176" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="201" y="176" width="165" height="40" rx="8" class="svg-box "/><text x="283.5" y="201" class="svg-mono svg-mid">lookup_order</text><path d="M460 146V176" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="378" y="176" width="165" height="40" rx="8" class="svg-box "/><text x="460.5" y="201" class="svg-mono svg-mid">process_refund</text><path d="M637 146V176" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="555" y="176" width="165" height="40" rx="8" class="svg-box "/><text x="637.5" y="201" class="svg-mono svg-mid">escalate_to_human</text><path d="M106 256V218" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="24" y="256" width="165" height="56" rx="8" class="svg-box good"/><text x="106.5" y="275" class="svg-label strong">Prerequisite gate</text><text x="106.5" y="292" class="svg-note svg-mid">refunds locked until</text><text x="106.5" y="307" class="svg-note svg-mid">identity is verified</text><path d="M283 256V218" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="201" y="256" width="165" height="56" rx="8" class="svg-box good"/><text x="283.5" y="275" class="svg-label strong">Sharper descriptions</text><text x="283.5" y="292" class="svg-note svg-mid">when to use each tool,</text><text x="283.5" y="307" class="svg-note svg-mid">and when not to</text><path d="M460 256V218" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="378" y="256" width="165" height="56" rx="8" class="svg-box good"/><text x="460.5" y="275" class="svg-label strong">PreToolUse hook</text><text x="460.5" y="292" class="svg-note svg-mid">refund &gt; $500 →</text><text x="460.5" y="307" class="svg-note svg-mid">block and escalate</text><path d="M637 256V218" class="svg-edge" fill="none" marker-end="url(#m-s1)"/><rect x="555" y="256" width="165" height="56" rx="8" class="svg-box good"/><text x="637.5" y="275" class="svg-label strong">Structured handoff</text><text x="637.5" y="292" class="svg-note svg-mid">summary, case facts,</text><text x="637.5" y="307" class="svg-note svg-mid">what was tried</text><text x="24" y="340" class="svg-note svg-left">Must-always rules (identity first, refund limits) live in code: a gate or a hook. The prompt handles judgment.</text><text x="24" y="358" class="svg-note svg-left">Green = the recommended design the exam rewards.</text></svg>