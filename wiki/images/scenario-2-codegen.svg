<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-label="Where Claude Code instructions go, and plan mode for big changes" data-name="s2"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="426" fill="#FFFFFF"/><defs><marker id="m-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">2 · Code Generation with Claude Code</text><rect x="24" y="98" width="190" height="41" rx="8" class="svg-box accent"/><text x="119.0" y="117" class="svg-label strong">A team instruction</text><text x="119.0" y="134" class="svg-note svg-mid">or workflow to share</text><path d="M214 119H236V70H262" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="262" y="50" width="474" height="40" rx="8" class="svg-box good"/><text x="276" y="75" class="svg-label svg-left">Applies to the whole repo</text><text x="500" y="75" class="svg-mono svg-left">CLAUDE.md (project root)</text><path d="M214 119H236V120H262" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="262" y="100" width="474" height="40" rx="8" class="svg-box good"/><text x="276" y="125" class="svg-label svg-left">Only some folders, e.g. tests</text><text x="500" y="125" class="svg-mono svg-left">.claude/rules/*.md + paths:</text><path d="M214 119H236V170H262" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="262" y="150" width="474" height="40" rx="8" class="svg-box good"/><text x="276" y="175" class="svg-label svg-left">Repeatable task, e.g. /review</text><text x="500" y="175" class="svg-mono svg-left">.claude/commands/ or a skill</text><path d="M214 119H236V220H262" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="262" y="200" width="474" height="40" rx="8" class="svg-box soft"/><text x="276" y="225" class="svg-label svg-left">Just my preference</text><text x="500" y="225" class="svg-mono svg-left">~/.claude/CLAUDE.md</text><text x="24" y="274" class="svg-label strong svg-left">How to work on it</text><rect x="24" y="286" width="220" height="41" rx="8" class="svg-box "/><text x="134.0" y="305" class="svg-label strong">Big change</text><text x="134.0" y="322" class="svg-note svg-mid">monolith split, migration</text><path d="M244 306H270" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="270" y="286" width="220" height="41" rx="8" class="svg-box good"/><text x="380.0" y="305" class="svg-label strong">Plan mode first</text><text x="380.0" y="322" class="svg-note svg-mid">explore, then propose</text><path d="M490 306H516" class="svg-edge" fill="none" marker-end="url(#m-s2)"/><rect x="516" y="286" width="220" height="41" rx="8" class="svg-box "/><text x="626.0" y="305" class="svg-label strong">Review the plan</text><text x="626.0" y="322" class="svg-note svg-mid">then let it execute</text><rect x="24" y="350" width="712" height="41" rx="8" class="svg-box good"/><text x="380.0" y="369" class="svg-label strong">Output keeps coming out wrong?</text><text x="380.0" y="386" class="svg-note svg-mid">give 2–3 concrete input → output examples, or write the tests first</text><text x="24" y="412" class="svg-note svg-left">Green = the recommended design the exam rewards.</text></svg>