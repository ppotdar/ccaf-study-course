<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-label="CLAUDE.md layering and conflict resolution" data-name="layers"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="352" fill="#FFFFFF"/><defs><marker id="m-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">All CLAUDE.md layers load; on a conflict, the most specific wins</text><rect x="24" y="56" width="390" height="48" rx="8" class="svg-box "/><text x="40" y="77" class="svg-label strong svg-left">Enterprise · managed by IT</text><text x="40" y="94" class="svg-note svg-left">Organization-wide policy, meant to hold for everyone</text><path d="M219 104V122" class="svg-edge" fill="none" marker-end="url(#m-layers)"/><rect x="24" y="122" width="390" height="48" rx="8" class="svg-box "/><text x="40" y="143" class="svg-label strong svg-left">User · just you</text><text x="40" y="160" class="svg-note svg-left">~/.claude/CLAUDE.md</text><path d="M219 170V188" class="svg-edge" fill="none" marker-end="url(#m-layers)"/><rect x="24" y="188" width="390" height="48" rx="8" class="svg-box "/><text x="40" y="209" class="svg-label strong svg-left">Project · the team</text><text x="40" y="226" class="svg-note svg-left">./CLAUDE.md: “2-space indent” · “write tests”</text><path d="M219 236V254" class="svg-edge" fill="none" marker-end="url(#m-layers)"/><rect x="24" y="254" width="390" height="48" rx="8" class="svg-box accent"/><text x="40" y="275" class="svg-label strong svg-left">Folder · this subtree</text><text x="40" y="292" class="svg-note svg-left">legacy/CLAUDE.md: “4-space indent”</text><text x="24" y="334" class="svg-note svg-left">General at the top, more specific toward the bottom.</text><path d="M414 278H456" class="svg-edge" fill="none" marker-end="url(#m-layers)"/><rect x="456" y="56" width="280" height="246" rx="8" class="svg-box soft"/><text x="472" y="84" class="svg-label strong svg-left">Editing legacy/billing.py</text><text x="472" y="118" class="svg-label strong svg-left good-text">✓ 4-space indent</text><text x="472" y="135" class="svg-note svg-left">folder beats project on conflicts</text><text x="472" y="168" class="svg-label strong svg-left good-text">✓ Write tests</text><text x="472" y="185" class="svg-note svg-left">no conflict, so it still applies</text><text x="472" y="218" class="svg-label strong svg-left bad-text">✗ 3-space indent</text><text x="472" y="235" class="svg-note svg-left">rules are never averaged</text><text x="472" y="268" class="svg-note svg-left">Must never break? Use a deny</text><text x="472" y="284" class="svg-note svg-left">rule or hook, not CLAUDE.md.</text></svg>