<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282" role="img" aria-label="Progressive disclosure of skills compared with CLAUDE.md" data-name="progressive"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="282" fill="#FFFFFF"/><text x="24" y="30" class="svg-title">Skills load in stages; CLAUDE.md loads in full</text><text x="24" y="99" class="svg-label strong svg-left">A skill</text><rect x="170" y="72" width="60" height="44" rx="8" class="svg-box accent"/><text x="200" y="99" class="svg-label strong">1</text><rect x="236" y="72" width="230" height="44" rx="8" class="svg-box soft dashed"/><text x="351" y="99" class="svg-label">2 · SKILL.md body</text><rect x="472" y="72" width="264" height="44" rx="8" class="svg-box soft dashed"/><text x="604" y="99" class="svg-label">3 · bundled files</text><text x="200" y="138" class="svg-label strong">Always</text><text x="200" y="155" class="svg-note svg-mid">name + description</text><text x="351" y="138" class="svg-label strong">When triggered</text><text x="351" y="155" class="svg-note svg-mid">description matched the task</text><text x="604" y="138" class="svg-label strong">Only if needed</text><text x="604" y="155" class="svg-note svg-mid">instructions call for a file</text><text x="24" y="211" class="svg-label strong svg-left">CLAUDE.md</text><rect x="170" y="184" width="566" height="44" rx="8" class="svg-box soft"/><text x="453" y="211" class="svg-label">Whole file, every session</text><text x="24" y="262" class="svg-note svg-left">Solid = always in context · Dashed = loaded only when needed · Lengths are illustrative, not measured.</text></svg>