<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" aria-label="Structured extraction with schema, validation and retry" data-name="s6"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="286" fill="#FFFFFF"/><g transform="translate(0,-34)"><defs><marker id="m-s6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><rect x="24" y="56" width="140" height="41" rx="8" class="svg-box "/><text x="94.0" y="75" class="svg-label strong">Document</text><text x="94.0" y="92" class="svg-note svg-mid">invoice, contract, form</text><path d="M164 76H190" class="svg-edge" fill="none" marker-end="url(#m-s6)"/><rect x="190" y="56" width="210" height="56" rx="8" class="svg-box good"/><text x="295.0" y="75" class="svg-label strong">Forced extraction tool</text><text x="295.0" y="92" class="svg-note svg-mid">tool_choice → JSON schema</text><text x="295.0" y="107" class="svg-note svg-mid">nullable fields, no guessing</text><path d="M400 76H426" class="svg-edge" fill="none" marker-end="url(#m-s6)"/><rect x="426" y="56" width="150" height="56" rx="8" class="svg-box "/><text x="501.0" y="75" class="svg-label strong">Validate</text><text x="501.0" y="92" class="svg-note svg-mid">totals add up?</text><text x="501.0" y="107" class="svg-note svg-mid">dates valid?</text><path d="M576 76H612" class="svg-edge" fill="none" marker-end="url(#m-s6)"/><text x="594" y="66" class="svg-note svg-mid">pass</text><rect x="612" y="56" width="124" height="40" rx="8" class="svg-box good"/><text x="674.0" y="81" class="svg-label strong">Valid JSON</text><path d="M501 112V150H295V112" class="svg-edge" fill="none" marker-end="url(#m-s6)"/><text x="400" y="168" class="svg-note svg-mid">fail → retry with the specific error</text><path d="M560 112V200" class="svg-edge" fill="none" marker-end="url(#m-s6)"/><text x="570" y="160" class="svg-note svg-left">value truly absent</text><rect x="426" y="200" width="310" height="41" rx="8" class="svg-box good"/><text x="581.0" y="219" class="svg-label strong">Stop retrying</text><text x="581.0" y="236" class="svg-note svg-mid">set null and route to human review</text><rect x="24" y="200" width="376" height="41" rx="8" class="svg-box good"/><text x="212.0" y="219" class="svg-label strong">Check quality per document type</text><text x="212.0" y="236" class="svg-note svg-mid">97% overall can hide a bad type; use stratified samples</text><rect x="24" y="262" width="376" height="41" rx="8" class="svg-box "/><text x="212.0" y="281" class="svg-label strong">Varied layouts?</text><text x="212.0" y="298" class="svg-note svg-mid">add few-shot examples of each format</text></g></svg>