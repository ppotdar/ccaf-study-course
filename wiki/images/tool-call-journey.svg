<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-label="Tool call flow through permissions and hooks" data-name="journey"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="580" fill="#FFFFFF"/><defs><marker id="m-journey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">Every tool call passes permissions first, then hooks</text><rect x="60" y="52" width="300" height="48" rx="8" class="svg-box accent"/><text x="210" y="81" class="svg-label strong">Claude proposes a tool call</text><path d="M210 100V128" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="128" width="300" height="48" rx="8" class="svg-box "/><text x="210" y="157" class="svg-label">Matches a deny rule?</text><path d="M210 176V204" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="204" width="300" height="48" rx="8" class="svg-box "/><text x="210" y="225" class="svg-label strong">Needs approval?</text><text x="210" y="242" class="svg-note svg-mid">ask rule, or Edit/Write/Bash by default</text><path d="M210 252V280" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="280" width="300" height="48" rx="8" class="svg-box "/><text x="210" y="301" class="svg-label strong">PreToolUse hook</text><text x="210" y="318" class="svg-note svg-mid">your script decides by exit code</text><path d="M210 328V356" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="356" width="300" height="48" rx="8" class="svg-box "/><text x="210" y="385" class="svg-label">Tool runs</text><path d="M210 404V432" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="432" width="300" height="48" rx="8" class="svg-box "/><text x="210" y="453" class="svg-label strong">PostToolUse hook</text><text x="210" y="470" class="svg-note svg-mid">normalize · trim · mask · log</text><path d="M210 480V508" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><rect x="60" y="508" width="300" height="48" rx="8" class="svg-box good"/><text x="210" y="537" class="svg-label strong">Result goes back to Claude</text><text x="220" y="192" class="svg-note svg-left">no</text><text x="220" y="268" class="svg-note svg-left">no (allow rule or read-only tool)</text><text x="220" y="344" class="svg-note svg-left">exit 0 → proceed · exit 1 / other → warn, proceed</text><path d="M360 152H430" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><text x="395" y="144" class="svg-note svg-mid">yes</text><rect x="430" y="128" width="306" height="48" rx="8" class="svg-box bad"/><text x="446" y="149" class="svg-label strong svg-left">Blocked: never runs</text><text x="446" y="166" class="svg-note svg-left">deny is checked first and always wins</text><path d="M360 228H430" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><text x="395" y="220" class="svg-note svg-mid">yes</text><rect x="430" y="204" width="306" height="48" rx="8" class="svg-box soft"/><text x="446" y="225" class="svg-label strong svg-left">You're asked to approve</text><text x="446" y="242" class="svg-note svg-left">approve → continues · decline → blocked</text><path d="M360 304H430" class="svg-edge" fill="none" marker-end="url(#m-journey)"/><text x="395" y="296" class="svg-note svg-mid">exit 2</text><rect x="430" y="280" width="306" height="48" rx="8" class="svg-box bad"/><text x="446" y="301" class="svg-label strong svg-left">Exit 2: blocked</text><text x="446" y="318" class="svg-note svg-left">the stderr reason is sent to Claude</text></svg>