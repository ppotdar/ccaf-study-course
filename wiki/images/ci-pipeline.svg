<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Claude Code in a CI pipeline" data-name="ci"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="320" fill="#FFFFFF"/><defs><marker id="m-ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">In CI, -p turns Claude Code into a step that finishes</text><rect x="174" y="48" width="210" height="40" rx="8" class="svg-box soft"/><text x="279" y="73" class="svg-label">CLAUDE.md: review criteria</text><path d="M279 88V116" class="svg-edge" fill="none" marker-end="url(#m-ci)"/><rect x="24" y="116" width="120" height="96" rx="8" class="svg-box "/><text x="84" y="168" class="svg-label strong">PR opened</text><path d="M144 164H174" class="svg-edge" fill="none" marker-end="url(#m-ci)"/><rect x="174" y="116" width="210" height="96" rx="8" class="svg-box accent"/><text x="279" y="142" class="svg-label strong">Claude Code in CI</text><text x="279" y="162" class="svg-small">claude -p "…"</text><text x="279" y="179" class="svg-small">--output-format json</text><text x="279" y="196" class="svg-small">--json-schema</text><path d="M384 164H414" class="svg-edge" fill="none" marker-end="url(#m-ci)"/><rect x="414" y="116" width="150" height="96" rx="8" class="svg-box "/><text x="489" y="160" class="svg-label strong">JSON findings</text><text x="489" y="178" class="svg-note svg-mid">match your schema</text><path d="M564 164H594" class="svg-edge" fill="none" marker-end="url(#m-ci)"/><rect x="594" y="116" width="142" height="96" rx="8" class="svg-box good"/><text x="665" y="160" class="svg-label strong">PR comments</text><text x="665" y="178" class="svg-note svg-mid">posted automatically</text><path d="M279 212V248" class="svg-edge" fill="none" marker-end="url(#m-ci)"/><text x="289" y="234" class="svg-note svg-left">if -p is missing</text><rect x="174" y="248" width="390" height="48" rx="8" class="svg-box bad"/><text x="369" y="269" class="svg-label strong">Without -p: no TTY, so it waits for input</text><text x="369" y="286" class="svg-note svg-mid">the job hangs until it times out</text></svg>