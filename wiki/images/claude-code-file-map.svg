</style><rect width="760" height="492" fill="#FFFFFF"/><defs><marker id="m-filemap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><text x="24" y="30" class="svg-title">Same kinds of config, two homes: the team's repo or just you</text><rect x="186" y="46" width="270" height="34" rx="8" class="svg-box accent"/><text x="321" y="68" class="svg-label strong">TEAM · the repo, shared via git</text><rect x="466" y="46" width="270" height="34" rx="8" class="svg-box soft"/><text x="601" y="68" class="svg-label strong">JUST YOU · personal</text><text x="24" y="113" class="svg-label strong svg-left">Instructions</text><rect x="186" y="92" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="113" class="svg-mono svg-left">CLAUDE.md</text><rect x="466" y="92" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="113" class="svg-mono svg-left">~/.claude/CLAUDE.md</text><text x="24" y="153" class="svg-label strong svg-left">MCP servers</text><rect x="186" y="132" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="153" class="svg-mono svg-left">.mcp.json</text><rect x="466" y="132" width="270" height="32" rx="8" class="svg-box accent"/><text x="478" y="153" class="svg-mono svg-left">~/.claude.json</text><text x="24" y="193" class="svg-label strong svg-left">Settings &amp; hooks</text><rect x="186" y="172" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="193" class="svg-mono svg-left">.claude/settings.json</text><rect x="466" y="172" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="193" class="svg-mono svg-left">~/.claude/settings.json</text><text x="24" y="233" class="svg-label strong svg-left">Slash commands</text><rect x="186" y="212" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="233" class="svg-mono svg-left">.claude/commands/</text><rect x="466" y="212" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="233" class="svg-mono svg-left">~/.claude/commands/</text><text x="24" y="273" class="svg-label strong svg-left">Skills</text><rect x="186" y="252" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="273" class="svg-mono svg-left">.claude/skills/&lt;name&gt;/SKILL.md</text><rect x="466" y="252" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="273" class="svg-mono svg-left">~/.claude/skills/&lt;name&gt;/SKILL.md</text><text x="24" y="313" class="svg-label strong svg-left">Subagents</text><rect x="186" y="292" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="313" class="svg-mono svg-left">.claude/agents/&lt;name&gt;.md</text><rect x="466" y="292" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="313" class="svg-mono svg-left">~/.claude/agents/&lt;name&gt;.md</text><text x="24" y="353" class="svg-label strong svg-left">Path rules</text><rect x="186" y="332" width="270" height="32" rx="8" class="svg-box "/><text x="198" y="353" class="svg-mono svg-left">.claude/rules/*.md</text><rect x="466" y="332" width="270" height="32" rx="8" class="svg-box soft dashed"/><text x="601" y="353" class="svg-note svg-mid">(team only)</text><text x="24" y="393" class="svg-label strong svg-left">One-project override</text><rect x="186" y="372" width="270" height="32" rx="8" class="svg-box soft dashed"/><text x="321" y="393" class="svg-note svg-mid">(no team file)</text><rect x="466" y="372" width="270" height="32" rx="8" class="svg-box "/><text x="478" y="393" class="svg-mono svg-left">.claude/settings.local.json</text><text x="24" y="432" class="svg-note svg-left">“Everyone who clones” → left column.  “Just me / experimental” → right column.</text><text x="24" y="452" class="svg-note svg-left">Odd one out (highlighted): personal MCP config is ~/.claude.json, one file, not inside ~/.claude/.</text><text x="24" y="472" class="svg-note svg-left">settings.local.json sits in the repo folder but is git-ignored, so it stays personal.</text></svg>