<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" role="img" aria-label="Claude Code in a CI pipeline" data-name="s5"><style>
.svg-title{font:700 16px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C}
.svg-label{font:400 13px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171A2C;text-anchor:middle}
.svg-label.strong{font-weight:600}
.svg-small{font:400 11.5px ui-monospace,Menlo,Consolas,monospace;fill:#5B6179;text-anchor:middle}
.svg-mono{font:400 12px ui-monospace,Menlo,Consolas,monospace;fill:#171A2C}
.svg-note{font:400 11.5px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6179;text-anchor:start}
.svg-left{text-anchor:start}.svg-mid{text-anchor:middle}
.svg-edge{stroke:#5B6179;stroke-width:1.25}.svg-fill-edge{fill:#5B6179}
.svg-box{fill:#FFFFFF;stroke:#5B6179;stroke-width:1.25}
.svg-box.accent{fill:#E7EAFB;stroke:#2F43C4;stroke-width:2}
.svg-box.soft{fill:#EEF0F7}.svg-box.dashed{stroke-dasharray:5 4}
.svg-box.good{fill:#E3F3EA;stroke:#1E7A4E}.svg-box.bad{fill:#FBE7E5;stroke:#B4372F}
.svg-label.good-text{fill:#1E7A4E}.svg-label.bad-text{fill:#B4372F}
</style><rect width="760" height="216" fill="#FFFFFF"/><g transform="translate(0,-34)"><defs><marker id="m-s5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="svg-fill-edge"/></marker></defs><rect x="24" y="50" width="160" height="40" rx="8" class="svg-box "/><text x="104.0" y="75" class="svg-label strong">PR opened</text><path d="M184 70H208" class="svg-edge" fill="none" marker-end="url(#m-s5)"/><rect x="208" y="50" width="160" height="41" rx="8" class="svg-box accent"/><text x="288.0" y="69" class="svg-mono svg-mid">claude -p</text><text x="288.0" y="86" class="svg-note svg-mid">non-interactive</text><path d="M368 70H392" class="svg-edge" fill="none" marker-end="url(#m-s5)"/><rect x="392" y="50" width="160" height="41" rx="8" class="svg-box "/><text x="472.0" y="69" class="svg-mono svg-mid">--json-schema</text><text x="472.0" y="86" class="svg-note svg-mid">+ --output-format json</text><path d="M552 70H576" class="svg-edge" fill="none" marker-end="url(#m-s5)"/><rect x="576" y="50" width="160" height="41" rx="8" class="svg-box "/><text x="656.0" y="69" class="svg-label strong">PR comments</text><text x="656.0" y="86" class="svg-note svg-mid">parsed, posted</text><text x="24" y="140" class="svg-label strong svg-left">What the exam rewards</text><rect x="24" y="152" width="160" height="56" rx="8" class="svg-box good"/><text x="104.0" y="171" class="svg-label strong">Explicit criteria</text><text x="104.0" y="188" class="svg-note svg-mid">report X, skip Y;</text><text x="104.0" y="203" class="svg-note svg-mid">cuts noisy findings</text><rect x="208" y="152" width="160" height="56" rx="8" class="svg-box good"/><text x="288.0" y="171" class="svg-label strong">Independent reviewer</text><text x="288.0" y="188" class="svg-note svg-mid">fresh instance: per-file</text><text x="288.0" y="203" class="svg-note svg-mid">+ one cross-file pass</text><rect x="392" y="152" width="160" height="56" rx="8" class="svg-box good"/><text x="472.0" y="171" class="svg-label strong">Prior findings</text><text x="472.0" y="188" class="svg-note svg-mid">fed back in, so re-runs</text><text x="472.0" y="203" class="svg-note svg-mid">don't duplicate comments</text><rect x="576" y="152" width="160" height="56" rx="8" class="svg-box good"/><text x="656.0" y="171" class="svg-label strong">Batch API</text><text x="656.0" y="188" class="svg-note svg-mid">nightly jobs only;</text><text x="656.0" y="203" class="svg-note svg-mid">pre-merge stays real-time</text><text x="24" y="238" class="svg-note svg-left">Pre-approve the tools the job needs (allowed tools): nobody is there to click Approve. Without -p the job hangs.</text></g></svg>